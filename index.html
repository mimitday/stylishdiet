<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A0A08">
<title>THE EDIT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@600;700&family=Cormorant+Garamond:wght@300;400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: #0A0A08;
  color: #F5F1E8;
  font-family: 'Cormorant Garamond', Georgia, serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.logo {
  font-family: 'Cormorant', serif;
  font-size: clamp(40px, 10vw, 72px);
  font-weight: 700;
  letter-spacing: 0.22em;
  color: #F5F1E8;
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 18px;
}
.rule {
  width: 36px;
  height: 0.5px;
  background: #C9A46A;
  margin-bottom: 18px;
}
.msg {
  font-size: 11px;
  letter-spacing: 0.46em;
  color: #C9A46A;
  text-transform: uppercase;
}
</style>
</head>
<body>
  <div class="logo">The Edit</div>
  <div class="rule"></div>
  <div class="msg">Currently editing.</div>
</body>
</html>
